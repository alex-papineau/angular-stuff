<div class="card">
    <h2 class="text-center text-2xl font-bold mb-4">Digital World Clock</h2>

    <div class="text-center mb-10">
        <h3 class="text-2xl font-bold mb-4">
            {{formatTime()}}
        </h3>

        <p class="text-xl text-gray-300">
            {{formatDate()}}
        </p>
        <p class="mt-2 font-semibold text-gray-400">Local Time</p>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
        @for(clock of worldClocks; track clock.country) {
        <div class="bg-gray-800 text-white! rounded-2xl p-6 shadow-lg text-center">
            <h3 class="text-2xl font-semibold mb-4">
                {{clock.country}}
            </h3>

            <p class="text-3xl font-bold mb-2">
                {{formatTime(clock.zone)}}
            </p>
            <hr class="my-2">
            <p class="text-3xl font-bold mb-2">
                {{formatDate(clock.zone)}}
            </p>
        </div>
        }
    </div>
</div>
