<div class="card flex flex-col justify-between">
    <h2 class="text-xl font-bold text-center mb-4">Stopwatch</h2>

    <div class="flex flex-col items-center justify-center my-auto py-4">
        <div class="w-full bg-[#111111] border border-[#222222] rounded-xl py-6 px-4 text-center">
            <span class="font-mono text-4xl sm:text-5xl font-bold text-white tracking-wider">
                {{ formattedTime() }}
            </span>
        </div>

        <div class="mt-6 flex flex-wrap justify-center gap-3 w-full">
            <button class="flex-1 min-w-[80px] bg-[#7b68ee] hover:opacity-90 text-white font-semibold py-2 px-4 rounded-lg transition cursor-pointer text-sm" (click)="start()">
                Start
            </button>
            <button class="flex-1 min-w-[80px] bg-[#111111] border border-[#222222] hover:border-white/40 text-white font-semibold py-2 px-4 rounded-lg transition cursor-pointer text-sm" (click)="stop()">
                Stop
            </button>
            <button class="flex-1 min-w-[80px] bg-[#111111] border border-[#222222] hover:border-white/40 text-white font-semibold py-2 px-4 rounded-lg transition cursor-pointer text-sm" (click)="reset()">
                Reset
            </button>
        </div>
    </div>
</div>
