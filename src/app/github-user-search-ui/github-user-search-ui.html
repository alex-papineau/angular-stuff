<div class="card flex flex-col justify-between">
    <h2 class="text-xl font-bold text-center mb-4">GitHub User Search</h2>

    <div class="flex flex-col space-y-3 my-auto">
        <div class="flex items-center gap-2">
            <input type="text" 
                placeholder="Enter username..."
                class="flex-grow bg-[#111111] border border-[#222222] focus:border-[#7b68ee] rounded-lg py-2 px-3 text-sm text-white placeholder:text-gray-500 focus:outline-none transition"
                (input)="query.set($any($event.target).value)" 
                (keyup.enter)="searchUser()" />
            <button class="bg-[#7b68ee] hover:opacity-90 text-white font-semibold py-2 px-4 rounded-lg text-sm transition cursor-pointer"
                (click)="searchUser()">
                Search
            </button>
        </div>

        @if (loading()) {
            <div class="py-4 text-center text-xs text-gray-400">
                Loading...
            </div>
        } 
        
        @if (error()) {
            <div class="p-2.5 rounded-lg bg-[#111111] border border-[#222222] text-white text-xs text-center">
                {{ error() }}
            </div>
        }

        @if (user()) {
            <div (click)="openProfile()" class="bg-[#111111] border border-[#222222] hover:border-[#7b68ee] p-4 rounded-xl text-center cursor-pointer transition">
                <img [src]="user().avatar_url" alt="Avatar" class="w-16 h-16 rounded-full mx-auto mb-2 border border-[#7b68ee]" />
                <h3 class="text-sm font-bold text-white">{{ user().name || user().login }}</h3>
                <p class="text-xs text-gray-400 mt-1">{{ user().bio || 'No bio available.' }}</p>
            </div>
        }
    </div>
</div>
