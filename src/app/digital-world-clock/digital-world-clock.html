<div class="card flex flex-col justify-between">
    <h2 class="text-xl font-bold text-center mb-4">Digital World Clock</h2>

    <div class="bg-[#111111] border border-[#222222] rounded-xl p-4 text-center mb-4">
        <span class="text-xs font-bold uppercase tracking-wider text-[#7b68ee] block mb-1">
            Local Time
        </span>
        <div class="text-3xl font-mono font-bold text-white tracking-widest my-1">
            {{ formatTime() }}
        </div>
        <p class="text-xs text-gray-400">
            {{ formatDate() }}
        </p>
    </div>

    <div class="space-y-2">
        @for(clock of worldClocks; track clock.country) {
        <div class="bg-[#111111] border border-[#222222] rounded-xl p-2.5 px-3 flex items-center justify-between">
            <div>
                <h3 class="text-xs font-bold text-gray-300">
                    {{ clock.country }}
                </h3>
                <p class="text-[11px] text-gray-400">
                    {{ formatDate(clock.zone) }}
                </p>
            </div>

            <p class="text-sm font-mono font-bold text-white">
                {{ formatTime(clock.zone) }}
            </p>
        </div>
        }
    </div>
</div>
