<div class="card flex flex-col justify-between">
    <h2 class="text-xl font-bold text-center mb-4">Password Generator</h2>

    <div class="flex flex-col justify-center my-auto py-4">
        <div class="bg-[#111111] border border-[#222222] rounded-xl p-4 min-h-[64px] flex items-center justify-center text-center mb-6">
            @if (password()) {
                <span class="font-mono text-lg font-bold text-[#7b68ee] tracking-widest break-all select-all">
                    {{ password() }}
                </span>
            } @else {
                <span class="text-xs text-gray-400">
                    Click below to generate a password
                </span>
            }
        </div>

        <button class="w-full bg-[#7b68ee] hover:opacity-90 text-white font-semibold py-2 px-4 rounded-lg transition cursor-pointer text-sm" (click)="generatePassword()">
            Generate Password
        </button>
    </div>
</div>
