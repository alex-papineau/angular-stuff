<div class="card text-2xl font-bold text-center p-4 bg-white text-black rounded-lg shadow-md">
    <h2 class="text-center text-2xl font-bold mb-4">Voting App</h2>
    <div class="flex flex-col gap-2">
        <input [(ngModel)]="newOption" type="text" placeholder="Enter new option" class="p-2 rounded-lg text-black border" />
        <button (click)="addOption()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Add
            Option</button>

        @for(option of store.options(); track option.id) {
        <div class="bg-gray-100 p-3 rounded mb-2">
            <div class="flex justify-between">
                <span>{{option.text}}</span>
                <span>{{option.votes}} votes</span>
            </div>
            <button (click)="store.vote(option.id)"
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-1 px-2 rounded mt-2">Vote</button>
            <div class="w-full bg-gray-300 rounded-full h-2 mt-2">
                <div class="bg-blue-500 h-2 rounded" [style.width.%]="getPercentage(option.votes)"></div>
            </div>
        </div>
        }

        Total Votes: {{store.totalVotes()}}
    </div>
</div>
