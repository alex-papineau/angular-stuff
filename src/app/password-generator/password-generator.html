<div class="card">
    <h2 class="text-center text-2xl font-bold mb-4">Password Generator</h2>
    <div class="justify-center items-center p-4">
        <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 mb-4" (click)="generatePassword()">
            Generate Password
        </button>
        <div class="flex flex-col gap-2">
            <p class="mt-4 text-black! font-mono break-all">{{ password() }}</p>
        </div>
    </div>
</div>
