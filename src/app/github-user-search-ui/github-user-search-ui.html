<div class="card p-0 overflow-hidden">
    <div class="flex-grow bg-white text-white! flex flex-col items-center justify-center p-6 h-full w-full">
        <div class="w-full max-w-md bg-gray-800 p-6 rounded-2xl shadow-lg space-y-4 px-6">
            <h2 class="text-2xl font-bold text-center">GitHub User Search</h2>
            <div class="flex items-center gap-2">
                <input type="text" placeholder="Enter GitHub username..."
                    class="bg-gray-700 text-white placeholder:text-gray-500 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    (input)="query.set($any($event.target).value)" />
                <button class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded"
                    (click)="searchUser()">Search</button>
            </div>

            @if (loading()) {
                <p class="text-center text-gray-400">Loading...</p>
            } @if (error()) {
                <p class="text-center text-red-500">{{ error() }}</p>
            }
            @if (user()) {
                <div (click)="openProfile()" class="bg-gray-700 p-4 rounded-lg shadow-md text-center cursor-pointer hover:scale-105 transform transition duration-300">
                    <img [src]="user().avatar_url" alt="Avatar" class="w-24 h-24 rounded-full mx-auto mb-4 border-2 border-blue-500" />
                    <h2 class="text-xl font-bold mb-2">{{ user().login || user().name }}</h2>
                    <p class="text-gray-400 text-sm">{{ user().bio || 'No bio available.' }}</p>
                </div>
            }
        </div>
    </div>
</div>
