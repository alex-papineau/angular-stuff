<div class="card flex flex-col justify-between">
    <h2 class="text-xl font-bold text-center mb-4">Chat UI</h2>

    <div class="flex-grow h-48 overflow-y-auto p-3 mb-3 bg-[#111111] border border-[#222222] rounded-xl space-y-2 flex flex-col">
        @if (messages().length === 0) {
            <div class="text-center text-xs text-gray-400 my-auto py-8">
                No messages yet.
            </div>
        } @else {
            @for(msg of messages(); track $index) {
            <div class="bg-[#7b68ee] text-white text-sm py-2 px-3.5 rounded-xl self-end max-w-[85%] break-words">
                {{ msg }}
            </div>
            }
        }
    </div>

    <div>
        <input class="w-full bg-[#111111] border border-[#222222] focus:border-[#7b68ee] rounded-lg py-2 px-3 text-sm text-white placeholder:text-gray-500 focus:outline-none transition" 
            type="text" 
            placeholder="Type a message..." 
            #input
            (keyup.enter)="send(input.value); input.value = ''" />
    </div>
</div>
