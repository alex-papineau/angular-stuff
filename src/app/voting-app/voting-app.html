<div class="card flex flex-col justify-between">
    <h2 class="text-xl font-bold text-center mb-4">Voting App</h2>

    <div class="flex flex-col space-y-3 my-auto">
        <div class="flex items-center gap-2">
            <input [(ngModel)]="newOption" 
                type="text" 
                placeholder="Enter new option..." 
                class="flex-grow bg-[#111111] border border-[#222222] focus:border-[#7b68ee] rounded-lg py-2 px-3 text-sm text-white placeholder:text-gray-500 focus:outline-none transition"
                (keyup.enter)="addOption()" />
            <button (click)="addOption()" 
                class="bg-[#7b68ee] hover:opacity-90 text-white font-semibold py-2 px-4 rounded-lg text-sm transition cursor-pointer">
                Add
            </button>
        </div>

        @if(store.options().length >= 10) {
            <div class="p-2 rounded-lg bg-[#111111] border border-[#222222] text-[#7b68ee] text-xs text-center font-medium">
                Maximum limit of 10 options reached.
            </div>
        }

        <div class="space-y-2.5 max-h-60 overflow-y-auto pr-1">
            @if(store.options().length === 0) {
                <div class="text-center text-xs text-gray-400 py-6">
                    No options yet.
                </div>
            } @else {
                @for(option of store.options(); track option.id) {
                <div class="bg-[#111111] border border-[#222222] p-3 rounded-xl">
                    <div class="flex items-center justify-between text-sm font-semibold text-white mb-2">
                        <span class="truncate mr-2">{{ option.text }}</span>
                        <span class="text-xs text-[#7b68ee] font-mono">
                            {{ option.votes }} ({{ getPercentage(option.votes) }}%)
                        </span>
                    </div>

                    <div class="w-full bg-black rounded-full h-2 overflow-hidden border border-[#222222] mb-2.5">
                        <div class="bg-[#7b68ee] h-full rounded-full transition-all duration-300" [style.width.%]="getPercentage(option.votes)"></div>
                    </div>

                    <button (click)="store.vote(option.id)"
                        class="w-full bg-[#111111] hover:bg-[#7b68ee] hover:text-white text-gray-300 font-medium py-1.5 px-3 rounded-lg text-xs transition cursor-pointer border border-[#222222] hover:border-[#7b68ee]">
                        Vote
                    </button>
                </div>
                }
            }
        </div>
    </div>
</div>
