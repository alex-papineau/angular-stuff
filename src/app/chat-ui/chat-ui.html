<div class="card p-4">
    <div class="flex-grow h-0 overflow-y-auto p-2 mb-4 border rounded">
        @for(msg of messages(); track msg) {
        <div class="bg-gray-200 p-2 mb-1 rounded">
            {{ (msg) }}
        </div>
        }
    </div>

    <input class="border p-2 w-full" type="text" placeholder="Type a message..." #input
        (keyup.enter)="send(input.value); input.value = ''" />
</div>
